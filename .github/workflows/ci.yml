name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # Pinned image, so the runner (and the Python builds available for
    # it) cannot change underneath the version matrix.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Nothing in this workflow calls a model: tests use the mock
      # backend or a fake CLI script, and the freshness check only
      # re-reads tracked data.
      - name: unit and integration tests
        run: python3 -m unittest discover -s tests -v
      - name: report freshness (regenerate tracked reports from tracked data, diff)
        run: python3 scripts/check_freshness.py
      - name: v1 legacy smoke run (mock backend)
        run: |
          python3 scripts/generate_leads.py --n 36 --out /tmp/leads.jsonl
          python3 run_eval.py --backend mock --runs 2 \
              --data /tmp/leads.jsonl --out /tmp/results.jsonl
          python3 scripts/report.py --results /tmp/results.jsonl \
              --out /tmp/REPORT.md
          grep -q "MOCK BACKEND" /tmp/REPORT.md
          grep -q "V1 LEGACY GRADING" /tmp/REPORT.md
      - name: v2 world-state run, offline grade, report (mock backend)
        run: |
          python3 run_world_eval.py --backend mock --runs 2 \
              --data /tmp/leads.jsonl --run-dir /tmp/world-mock
          python3 scripts/grade_world.py --run-dir /tmp/world-mock \
              --data /tmp/leads.jsonl --out /tmp/world-grade.json
          python3 scripts/world_report.py --run-dir /tmp/world-mock \
              --data /tmp/leads.jsonl --out /tmp/WORLD-REPORT.md
          grep -q "MOCK BACKEND" /tmp/WORLD-REPORT.md
          grep -q "v2 world-state report" /tmp/WORLD-REPORT.md
